<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>XA Downloader - Video Saver</title>
  <style>
    :root{
      --text:#e9eef4;
      --white:#ffffff;
      --green:#7bc043;
      --green2:#69b233;
      --shadow: 0 18px 50px rgba(0,0,0,.35);

      --page-pad: clamp(12px, 3.8vw, 18px);
      --card-radius: clamp(16px, 4.4vw, 22px);
      --top-radius: clamp(16px, 4.2vw, 18px);
      --title-size: clamp(22px, 6.4vw, 32px);
      --btn-size: clamp(18px, 5.2vw, 22px);
      --row-gap: clamp(10px, 3.6vw, 12px);

      --thumb-blur: clamp(0px, 0.4vw, 1.5px);
      --thumb-dim: 1;

      --thumb-overlay: rgba(10,12,14,.10);
      --thumb-overlay-2: rgba(10,12,14,.03);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #07090c 0%, #0b0d10 55%, #0b0d10 100%);
      color:var(--text);
    }

    .stage{
      width:100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display:flex;
      flex-direction:column;
    }

    .top{padding: calc(var(--page-pad) + 6px) var(--page-pad) 10px;}
    .topCard{
      background: rgba(15,19,24,.92);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: var(--top-radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .topHeader{
      display:flex;justify-content:space-between;align-items:center;
      padding: 14px 14px 8px;
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .badge{
      display:inline-flex;gap:8px;align-items:center;
      padding:6px 10px;border-radius:999px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.85);
      font-size:12px;
    }
    .badge .dot{
      width:8px;height:8px;border-radius:99px;background:var(--green);
      box-shadow:0 0 0 4px rgba(123,192,67,.15);
    }
    .pillBtn{
      appearance:none;border:0;
      padding:8px 12px;border-radius:999px;
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      font-weight:600;font-size:12px;
      cursor:default;opacity:.75;
    }

    .list{padding:10px 10px 12px;}
    .row{
      display:flex;align-items:center;gap: var(--row-gap);
      padding:10px 8px;border-radius:14px;
    }

    .thumb{
      width: clamp(84px, 26vw, 96px);
      height: clamp(48px, 15vw, 54px);
      border-radius:10px;
      position:relative;
      overflow:hidden;
      flex:0 0 auto;
      border:1px solid rgba(255,255,255,.06);
      background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.04));
    }
    .thumbVideo{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit: cover;
      object-position: center;
      filter: blur(var(--thumb-blur)) contrast(1.06) saturate(1.04);
      transform: none;
      opacity: var(--thumb-dim);
    }
    .thumb::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, var(--thumb-overlay), var(--thumb-overlay-2));
      pointer-events:none;
      z-index:2;
    }
    .thumb::before{
      content:"";
      position:absolute; inset:-40px -40px auto auto;
      width:110px;height:110px;
      background: radial-gradient(circle at 30% 30%, rgba(123,192,67,.28), rgba(123,192,67,0) 60%);
      transform: rotate(12deg);
      z-index:3;
      pointer-events:none;
    }

    .play{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      z-index:4;
    }
    .play span{
      width:0;height:0;
      border-top:10px solid transparent;border-bottom:10px solid transparent;
      border-left:16px solid rgba(255,255,255,.9);
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.4));
      transform: translateX(1px);
    }

    .meta{flex:1 1 auto;min-width:0}
    .title{
      font-size:14px;font-weight:700;color: rgba(255,255,255,.92);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 2px;
    }
    .sub{display:flex;gap:10px;align-items:center;color: rgba(255,255,255,.56);font-size:12px;}
    .time{display:inline-flex;gap:6px;align-items:center;color: rgba(255,255,255,.56);}
    .clock{width:14px;height:14px;border-radius:99px;border:1.6px solid rgba(255,255,255,.45);position:relative;}
    .clock:before{content:"";position:absolute;left:6.2px;top:3px;width:1.6px;height:5px;background:rgba(255,255,255,.45);border-radius:2px;}
    .clock:after{content:"";position:absolute;left:6.2px;top:6.2px;width:4.8px;height:1.6px;background:rgba(255,255,255,.45);border-radius:2px;}

    .dl{
      width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
      background: rgba(123,192,67,.10);
      border: 1px solid rgba(123,192,67,.35);
      flex:0 0 auto;
    }
    .hint{padding:0 14px 12px;color: rgba(255,255,255,.45);font-size:12px;}

    .divider{height:22px;position:relative;}
    .divider:before{
      content:"";position:absolute;left:50%;top:-10px;transform:translateX(-50%);
      width:56px;height:6px;border-radius:999px;background: rgba(255,255,255,.12);
    }

    .bottom{
      background: var(--white);color:#111;
      border-top-left-radius: var(--card-radius);
      border-top-right-radius: var(--card-radius);
      margin-top:auto;
      padding: 18px var(--page-pad) calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -16px 60px rgba(0,0,0,.45);
    }
    .appTitle{
      font-size: var(--title-size);
      font-weight:900;
      letter-spacing:.2px;
      margin:4px 0 12px;
      line-height: 1.1;
    }
    .ratingRow{
      display:flex;align-items:center;justify-content:center;
      gap:10px;color:#666;margin-bottom:18px;
    }
    .stars{display:flex;gap:6px;align-items:center}
    .star{
      width:24px;height:24px;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      background:#2a2a2a;opacity:.85;
    }
    .star.dim{opacity:.25}
    .count{font-size:16px;}
    .installBtn{
      width:100%;
      border:0;border-radius:14px;
      padding: 16px 14px;
      font-size: var(--btn-size);
      font-weight:900;
      color:#fff;
      background: linear-gradient(180deg, var(--green) 0%, var(--green2) 100%);
      cursor:pointer;
      touch-action: manipulation;
    }
    .installBtn:active{transform: translateY(1px)}
    .network{text-align:center;color:#9a9a9a;font-size:12px;margin-top:10px;}

    .noClick, .noClick *{pointer-events:none !important;user-select:none;}

    @media (orientation: landscape){
      .top{padding-top: 14px;}
      .appTitle{font-size: clamp(20px, 4.2vw, 30px);}
    }

    @media (prefers-reduced-motion: reduce){
      .thumbVideo{display:none;}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="top noClick">
      <div class="topCard" role="region" aria-label="Video list">
        <div class="topHeader">
          <div class="badge"><span class="dot"></span><span>Video list</span></div>
          <button class="pillBtn" type="button" aria-disabled="true">Refresh</button>
        </div>
        <div class="list" id="videoList"></div>
        <div class="hint">Display only.</div>
      </div>
    </div>

    <div class="divider noClick" aria-hidden="true"></div>

    <section class="bottom" role="region" aria-label="Install card">
      <div class="appTitle" id="appTitle">Video Downloader - Save Videos</div>

      <div class="ratingRow noClick">
        <div class="stars" aria-label="Rating">
          <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div><div class="star dim"></div>
        </div>
        <div class="count" id="ratingCount">(61,241)</div>
      </div>

      <button class="installBtn" id="installBtn" type="button">Install</button>
      <div class="network noClick" id="networkText">Mintegral</div>
    </section>
  </div>

  <script>
    const PLAY_URL = "https://play.google.com/store/apps/details?id=com.ironmeta.video.fast.hd.downloader.secure.player";
    const videoSrc = ["白擦2.mp4","白擦3.mp4","白擦4.mp4","白擦5.mp4"];

    const data = [
      { title: "An ambiguous game", author: "Ananya", dur: "2:56", src: videoSrc[0] },
      { title: "Beautiful Neighbor", author: "Celie",  dur: "3:27", src: videoSrc[1] },
      { title: "A happy gathering", author: "Mariana", dur: "7:57", src: videoSrc[2] },
      { title: "Wife and brothers", author: "Ananya",  dur: "6:36", src: videoSrc[3] },
    ];

    function dlIcon(){
      return `
        <div class="dl" aria-label="Download">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 18a4 4 0 0 1 .4-7.98A5 5 0 0 1 17.8 7.6 3.5 3.5 0 0 1 18.5 18H7Z" stroke="rgba(123,192,67,.95)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 12v7" stroke="rgba(123,192,67,.95)" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 16l3 3 3-3" stroke="rgba(123,192,67,.95)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      `;
    }

    function thumbVideo(src){
      return `
        <video
          class="thumbVideo"
          muted
          playsinline
          webkit-playsinline
          autoplay
          loop
          preload="metadata"
          disablepictureinpicture
          controlslist="nodownload noplaybackrate noremoteplayback"
          aria-hidden="true"
        >
          <source src="${src}" type="video/mp4" />
        </video>
      `;
    }

    function rowTemplate(item){
      return `
        <div class="row">
          <div class="thumb" aria-hidden="true">
            ${thumbVideo(item.src)}
            <div class="play"><span></span></div>
          </div>
          <div class="meta">
            <p class="title">${item.title}</p>
            <div class="sub">
              <span>${item.author}</span>
              <span class="time"><span class="clock"></span><span>${item.dur}</span></span>
            </div>
          </div>
          ${dlIcon()}
        </div>
      `;
    }

    document.getElementById('videoList').innerHTML = data.map(rowTemplate).join('');

    function tryPlayAll(){
      const vids = Array.from(document.querySelectorAll('.thumbVideo'));
      vids.forEach(v => {
        try{
          const p = v.play();
          if(p && typeof p.catch === 'function') p.catch(()=>{});
        }catch(e){}
      });
    }

    window.addEventListener('load', tryPlayAll);

    document.addEventListener('visibilitychange', ()=>{
      const vids = Array.from(document.querySelectorAll('.thumbVideo'));
      if(document.hidden){
        vids.forEach(v => { try{ v.pause(); }catch(e){} });
      }else{
        tryPlayAll();
      }
    });

    document.getElementById('installBtn').addEventListener('click', ()=>{
      window.location.href = PLAY_URL;
    });
  </script>
</body>
</html>
